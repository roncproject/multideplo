name: Remote Build and AWS Deploy (Hardened Only)

on:
  push:
    branches:
      - main

jobs:
  orchestrate-deployment:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the configuration orchestration files
    - name: Checkout Configuration Orchestrator Repo
      uses: actions/checkout@v4

    # 2. Authenticate and pull ONLY the Hardened Game codebase
    - name: Checkout Hardened RuhRohgue Game Code
      uses: actions/checkout@v4
      with:
        repository: 'roncproject/ruhrohgue'
        token: ${{ secrets.DEPENDENCY_GITHUB_TOKEN }}
        path: 'build-dir-app1'

    # 3. Provision Corretto Java 17 environment tools
    - name: Setup Amazon Corretto JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: 'maven'

    # 4. Compile App 1 (Hardened Game)
    - name: Compile and Stage Hardened Game
      run: |
        cd build-dir-app1
        mvn clean package -DskipTests
        cp target/ruhrohgue.jar ../app1.jar

    # 5. Discard raw code directory
    - name: Discard Code Source Buffer
      run: rm -rf build-dir-app1

    # 6. Create a lightweight static placeholder for App 2
    # This prevents the Dockerfile from breaking, but takes 0MB memory and runs no code!
    - name: Create Dummy Placeholder for App 2
      run: echo "Not running" > app2.jar

    # 7. Package deployment artifacts
    - name: Compress Multi-App Elastic Beanstalk Bundle
      run: zip -r deployment.zip Dockerfile nginx.conf entrypoint.sh Dockerrun.aws.json app1.jar app2.jar

    # 8. Inject secure AWS IAM credentials (UPDATED TO PARIS)
    - name: Inject AWS IAM Authentication
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'eu-west-3'

    # 9. Ship Bundle to AWS Elastic Beanstalk (UPDATED TO PARIS & REQUIRES YOUR CONSOLE NAMES)
    - name: Ship Bundle to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: 'RuhRohgue-Production'  # <-- CHANGE THIS
        environment_name: 'RuhRohgue-Production-env'  # <-- CHANGE THIS
        version_label: 'release-${{ github.sha }}'
        region: 'eu-west-3'
        deployment_package: 'deployment.zip'
