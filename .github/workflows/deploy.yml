name: Remote Build and AWS Deploy (Hardened Only)

on:
  push:
    branches:
      - main

jobs:
  orchestrate-deployment:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the configuration orchestration files from this repo
    - name: Checkout Configuration Orchestrator Repo
      uses: actions/checkout@v4

    # 2. Authenticate and pull ONLY the Hardened Game codebase using your PAT
    - name: Checkout Hardened RuhRohgue Game Code
      uses: actions/checkout@v4
      with:
        repository: 'roncproject/ruhrohgue'
        token: ${{ secrets.DEPENDENCY_GITHUB_TOKEN }}
        path: 'build-dir-app1'

    # 3. Provision Corretto Java 17 environment tools for compiling and running tests
    - name: Setup Amazon Corretto JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: 'maven'

    # 4. Compile App 1 (Hardened Game) using Maven
    - name: Compile and Stage Hardened Game
      run: |
        cd build-dir-app1
        mvn clean package -DskipTests
        cp target/ruhrohgue.jar ../app1.jar

    # 5. START PRE-CLOUDFLARE LOCAL ACCEPTANCE TEST SERVER (Bypasses Cloudflare constraints)
    - name: Launch Pre-Cloudflare Local Acceptance Server
      run: |
        java -Dserver.port=8081 -Xmx512m -jar app1.jar &
        echo "Waiting for local Java server to wake up on port 8081..."
        sleep 12

    # 6. EXECUTE NATIVE JAVA PLAYWRIGHT + PAGE OBJECT MODEL GATE
    - name: Execute Java Page Object Acceptance Test Suite
      run: |
        cd tests-e2e
        mvn test

    # 7. Discard raw code directory (Only executed if the E2E quality gate passes successfully)
    - name: Discard Code Source Buffer
      run: rm -rf build-dir-app1

    # 8. Create a lightweight static placeholder for App 2 to ensure Docker building compliance
    - name: Create Dummy Placeholder for App 2
      run: echo "Not running" > app2.jar

    # 9. Package deployment artifacts into a production-ready bundle
    - name: Compress Multi-App Elastic Beanstalk Bundle
      run: zip -r deployment.zip Dockerfile nginx.conf entrypoint.sh Dockerrun.aws.json app1.jar app2.jar

    # 10. Inject secure AWS IAM credentials targeting the active Paris zone
    - name: Inject AWS IAM Authentication
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'eu-west-3'

    # 11. Ship Verified Bundle directly onto your Paris Single-Instance environment
    - name: Ship Bundle to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: 'RuhRohgue-Production'
        environment_name: 'RuhRohgue-Production-env'
        version_label: 'release-${{ github.sha }}'
        region: 'eu-west-3'
        deployment_package: 'deployment.zip'
